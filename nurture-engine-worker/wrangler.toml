name = "nurture-engine"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Sweep every 15 minutes — nurture steps are day-granularity, no need for the reminder
# engine's 5-minute cadence.
[triggers]
crons = ["*/15 * * * *"]

# SHARED automation D1 spine (reminder + nurture enrollments, steps, and the one
# automation_events log the dashboard reads). Create ONCE (either worker dir), then apply
# BOTH schemas:
#   npx wrangler d1 create amari-automation   # paste the returned id here AND in
#                                             # reminder-engine-worker/wrangler.toml
#   npx wrangler d1 execute amari-automation --remote --file=schema.sql   (run in each worker dir)
[[d1_databases]]
binding = "NURTURE_DB"
database_name = "amari-automation"
database_id = "089d810a-9d2d-43a4-8f1d-dc3620835557"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (set once in this dir): WORKER_AUTH_SECRET (same value as the other workers + Pages env).
#   echo "<secret>" | npx wrangler secret put WORKER_AUTH_SECRET
# Active mode only (later): GHL_CLIENT_ID, GHL_CLIENT_SECRET for send/contact-read/tag-write.
