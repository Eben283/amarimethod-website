name = "nurture-engine"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Sweep every 15 minutes — nurture steps are day-granularity, no need for the reminder
# engine's 5-minute cadence.
[triggers]
crons = ["*/15 * * * *"]

# SHARED automation D1 spine (reminder + nurture enrollments, steps, and the one
# automation_events log the dashboard reads). Create ONCE (either worker dir), then apply
# BOTH schemas:
#   npx wrangler d1 create amari-automation   # paste the returned id here AND in
#                                             # reminder-engine-worker/wrangler.toml
#   npx wrangler d1 execute amari-automation --remote --file=schema.sql   (run in each worker dir)
[[d1_databases]]
binding = "NURTURE_DB"
database_name = "amari-automation"
database_id = "089d810a-9d2d-43a4-8f1d-dc3620835557"

# Provider-neutral people, tags, and branch attributes. The Worker accepts transition-era
# provider contact IDs only through external_records and then acts on the owned contact.
[[d1_databases]]
binding = "CRM_DB"
database_name = "amari-crm-mirror"
database_id = "91a5a51d-0319-4c6d-9a6b-36bee3805e62"

# Token cache used only by the bounded legacy /tag-webhook adapter for a read-only GHL tag
# lookup. Direct /event guards, branches, recipients, and tag writes use CRM_DB.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (set once in this dir): WORKER_AUTH_SECRET (same value as the other workers + Pages env).
#   echo "<secret>" | npx wrangler secret put WORKER_AUTH_SECRET
# GHL_WEBHOOK_SECRET (same value as the Pages purchase webhooks — the /tag-webhook gate).
# Native Gmail delivery additionally requires the actor-scoped Amari Google OAuth client secrets
# plus BOTH NURTURE_EMAIL_DELIVERY_RELEASE=approved and a valid JSON
# NURTURE_EMAIL_SEQUENCE_ALLOWLIST. Neither release gate is declared here; every sequence remains
# source-level shadow, and provider submission is not claimed as terminal delivery evidence.
