name = "funnel-refresh"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cron trigger — LIVE (cutover 2026-06-12). Hourly refresh of funnel:latest.
# Workers PAID plan — no cron-count cap. scheduled() writes the live key.
[triggers]
crons = ["45 * * * *"]

# Same KV namespace as Pages + daily-audit + ghl-token-refresh + partner-activity-refresh.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# Secrets (set via `npx wrangler secret put <KEY>`):
#   GHL_CLIENT_ID       — same as ghl-token-refresh (for KV token refresh fallback)
#   GHL_CLIENT_SECRET   — same as ghl-token-refresh
#   WORKER_AUTH_SECRET  — optional; gates the HTTP /refresh + /status routes

# Persist logs + metrics to the Workers dashboard so failures are searchable and
# countable (previously console.error/warn only existed during a live `wrangler
# tail` and vanished when the request/cron ended). head_sampling_rate=1 = keep all.
[observability]
enabled = true
head_sampling_rate = 1
