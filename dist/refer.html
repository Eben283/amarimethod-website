<body>
<!-- Header is injected by site-v6.js -->

<main class="util-page">
<section class="pagehead"><div class="wrap">
  <span class="eyebrow">Partners</span>
  <h1 id="page-heading">Submit a <em>referral.</em></h1>
  <p>Name and number. We'll handle the rest.</p>
</div></section>
<section class="panel"><div class="wrap"><div class="panel-inner">
  <div id="referral-form-container">
    <form id="referral-form">
      <div class="field">
        <label for="client-first-name">Client first name *</label>
        <input type="text" id="client-first-name" name="clientFirstName" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="client-phone">Client phone *</label>
        <input type="tel" id="client-phone" name="clientPhone" inputmode="tel" autocomplete="tel" required>
      </div>
      <div class="field">
        <label for="pain-area">What hurts? <span class="hint">(optional)</span></label>
        <input type="text" id="pain-area" name="painArea" placeholder="e.g. low back, shoulder, knee">
      </div>
      <div id="form-error" class="form-error"></div>
      <button type="submit" id="submit-btn" class="btn">Submit referral</button>
    </form>
  </div>
  <div id="referral-success" class="success">
    <div class="mark">✓</div>
    <h2>Got it</h2>
    <p id="success-message">We'll reach out and take it from here.</p>
    <a href="/refer" id="another-referral-link" class="btn btn-outline">Submit another referral</a>
  </div>
</div></div></section>
</main>
<!-- Footer is injected by site-v6.js -->
<script src="/js/site-v6.js?v=27" data-nav=""></script>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const refParam = urlParams.get('ref') || '';
  if (refParam) {
    document.getElementById('page-heading').textContent = 'Submit a referral, ' + refParam;
    document.getElementById('another-referral-link').href = '/refer?ref=' + encodeURIComponent(refParam);
  }
  document.getElementById('referral-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('form-error');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    errorDiv.style.display = 'none';
    const payload = {
      affiliateRef: refParam || 'unknown',
      clientFirstName: form.clientFirstName.value.trim(),
      clientPhone: form.clientPhone.value.trim(),
      painArea: form.painArea.value.trim(),
    };
    try {
      const response = await fetch('/api/affiliate-refer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
      document.getElementById('success-message').textContent =
        "We'll reach out to " + payload.clientFirstName + ' and take it from here.';
      document.getElementById('referral-form-container').style.display = 'none';
      document.getElementById('referral-success').style.display = 'block';
      gtag('event', 'affiliate_referral_submitted', { affiliate_ref: payload.affiliateRef });
    } catch (err) {
      errorDiv.textContent = err.message;
      errorDiv.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });
</script>

</body>
