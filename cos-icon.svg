<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B1F3B"/>
      <stop offset="100%" style="stop-color:#0F1225"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B8CDE"/>
      <stop offset="100%" style="stop-color:#4F5B93"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5CDFF"/>
      <stop offset="100%" style="stop-color:#8B9AEF"/>
    </linearGradient>
  </defs>
  <!-- Dark navy background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Outer compass ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.3"/>
  <!-- Four compass points -->
  <circle cx="256" cy="110" r="6" fill="url(#spark)" opacity="0.5"/>
  <circle cx="256" cy="402" r="6" fill="url(#spark)" opacity="0.5"/>
  <circle cx="110" cy="256" r="6" fill="url(#spark)" opacity="0.5"/>
  <circle cx="402" cy="256" r="6" fill="url(#spark)" opacity="0.5"/>
  <!-- Central star/spark — the intelligence -->
  <path d="M256 176 L272 232 L328 232 L282 264 L298 320 L256 288 L214 320 L230 264 L184 232 L240 232 Z" fill="url(#spark)"/>
  <!-- Subtle inner glow -->
  <circle cx="256" cy="256" r="48" fill="url(#spark)" opacity="0.08"/>
</svg>
