<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>How was your session? | Amari Method</title>
  <link rel="canonical" href="https://www.amarimethod.com/how-are-you">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "vuvx43xu8h");
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DGQM32BMYZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DGQM32BMYZ');
  </script>

  <style>
    :root{
      --cream:#F8F1E8;
      --paper:#FCF7F1;
      --ink:#211D19;
      --body:#5C554D;
      --line:rgba(33,29,25,.14);
      --peach:#E1A98B;
      --serif:"Cormorant Garamond", Georgia, serif;
      --sans:"General Sans", ui-sans-serif, system-ui, sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--cream);color:var(--ink);font-family:var(--sans);
      padding:32px 24px;-webkit-font-smoothing:antialiased;
    }
    .gate{width:100%;max-width:480px;text-align:center}
    .gate .logo{height:44px;width:auto;margin-bottom:48px}
    .gate h1{
      font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,40px);
      line-height:1.15;margin:0 0 16px;
    }
    .gate .sub{font-size:16px;color:var(--body);margin:0 0 36px;line-height:1.5}
    .screen[hidden]{display:none}
    .choices{display:flex;flex-direction:column;gap:14px;margin-top:40px}
    .btn{
      display:inline-block;background:var(--ink);color:#fff;font-family:var(--sans);
      font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.16em;
      padding:18px 34px;border-radius:2px;border:none;cursor:pointer;text-decoration:none;
      width:100%;box-sizing:border-box;
    }
    .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--ink)}
    .feedback-input{
      width:100%;box-sizing:border-box;min-height:150px;margin:0 0 16px;padding:16px 18px;
      border-radius:2px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
      font-family:var(--sans);font-size:16px;line-height:1.5;resize:vertical;text-align:left;
    }
    .feedback-input:focus{outline:none;border-color:var(--ink)}
    .back{
      display:inline-block;margin-top:20px;font-size:14px;color:var(--body);
      background:none;border:none;cursor:pointer;text-decoration:underline;
    }
    .gate .footer{
      margin-top:48px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--body);
    }
  </style>
</head>
<body>
  <main class="gate">
    <img class="logo" src="/images/AmariLogo.avif" alt="Amari Method" width="200" height="44">

    <section class="screen" id="ask">
      <h1>How was your session?</h1>
      <div class="choices">
        <a class="btn"
           href="https://g.page/r/Cd5GNnATe8p_EAE/review"
           onclick="gtag('event','review_gate_positive');">It helped →</a>
        <button type="button" class="btn btn-outline" onclick="showFeedback();">Not really</button>
      </div>
    </section>

    <section class="screen" id="feedback" hidden>
      <h1>What could we have done better?</h1>
      <p class="sub">Tell us straight. We read every note, and we'll make it right.</p>
      <textarea class="feedback-input" id="feedbackText"
        placeholder="What didn't land, and what you'd want next time."></textarea>
      <div class="choices">
        <a class="btn" id="feedbackSend" href="#">Send to the team →</a>
      </div>
      <button type="button" class="back" onclick="showAsk();">← Back</button>
    </section>

    <div class="footer">Amari Method · San Francisco</div>
  </main>

  <script>
    var ask = document.getElementById('ask');
    var feedback = document.getElementById('feedback');
    function showFeedback() {
      gtag('event', 'review_gate_feedback');
      ask.setAttribute('hidden', '');
      feedback.removeAttribute('hidden');
      document.getElementById('feedbackText').focus();
    }
    function showAsk() {
      feedback.setAttribute('hidden', '');
      ask.removeAttribute('hidden');
    }
    document.getElementById('feedbackSend').addEventListener('click', function (e) {
      var text = document.getElementById('feedbackText').value.trim();
      if (!text) {
        e.preventDefault();
        document.getElementById('feedbackText').focus();
        return;
      }
      gtag('event', 'review_gate_feedback_sent');
      this.href = 'mailto:hello@amarimethod.com'
        + '?subject=' + encodeURIComponent('Feedback for the team')
        + '&body=' + encodeURIComponent(text);
    });
  </script>
</body>
</html>
