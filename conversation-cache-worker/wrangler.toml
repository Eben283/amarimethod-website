name = "conversation-cache"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Incremental conversation cache. Pulls only what changed since the last run and
# upserts per-contact message history into KV, so downstream consumers (the
# outreach coach's cadence step, learning, etc.) read the cache instead of each
# re-pulling 60 days of GHL conversations every day.
#
# Crons: every 3 hours = cheap incremental sync (just the delta). Mondays 09:00 UTC
# = a FULL reconcile (re-scan the whole window) as drift insurance. The first run
# backfills ~90 days.
[triggers]
crons = ["30 */3 * * *", "30 2 * * 1"]

# Same KV namespace as Pages + the other workers.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# Workers AI — Whisper transcription of call recordings (cloud, no Mac dependency).
[ai]
binding = "AI"

# Secrets (set via `npx wrangler secret put <KEY>`):
#   GHL_CLIENT_ID       — same as ghl-token-refresh (token refresh fallback)
#   GHL_CLIENT_SECRET   — same as ghl-token-refresh
#   WORKER_AUTH_SECRET  — gates the HTTP /sync + /status routes

# Persist logs + metrics to the Workers dashboard so failures are searchable and
# countable (previously console.error/warn only existed during a live `wrangler
# tail` and vanished when the request/cron ended). head_sampling_rate=1 = keep all.
[observability]
enabled = true
head_sampling_rate = 1
