name = "ghl-token-refresh"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Proactive token refresh every 12 hours. Minute 37 on purpose: the :00
# minute is when funnel-refresh + series-reconcile (hourly) and
# conversation-cache (3-hourly) all fire — refreshing the single-use token
# in that window races their on-demand refreshes. See the 2026-07-02 audit
# (ops/docs/2026-07-02-website-workers-bug-audit.md §3).
[triggers]
crons = ["37 */12 * * *"]

# Bind the same KV namespace used by Cloudflare Pages
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# GHL_CLIENT_ID and GHL_CLIENT_SECRET are set via:
#   npx wrangler secret put GHL_CLIENT_ID
#   npx wrangler secret put GHL_CLIENT_SECRET
