name: install CRM GHL source archive schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-production-schema
  cancel-in-progress: false

jobs:
  install:
    name: verify and install migration 0035
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Refuse stale source or a broadened migration set
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          test "$(find crm-mirror-worker/migrations -maxdepth 1 -type f -name '*.sql' -print | sort | tail -n 1)" = "crm-mirror-worker/migrations/0035_ghl_communication_source_archive.sql"
          npm run check:crm-mirror-release
      - name: Verify production schema boundary
        id: boundary
        working-directory: crm-mirror-worker
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          npx --yes wrangler@4.125.0 d1 execute amari-crm-mirror --config wrangler.jsonc --remote --command "SELECT id, name FROM d1_migrations ORDER BY id DESC LIMIT 1" --json > "$before"
          table_state="$(mktemp)"
          npx --yes wrangler@4.125.0 d1 execute amari-crm-mirror --config wrangler.jsonc --remote --command "SELECT name FROM sqlite_schema WHERE name IN ('ghl_communication_source_records','idx_ghl_communication_source_event','idx_ghl_communication_source_thread','idx_ghl_communication_source_contact','idx_ghl_communication_source_type') ORDER BY name" --json > "$table_state"
          node -e 'const fs=require("node:fs");const rows=(path)=>{const p=JSON.parse(fs.readFileSync(path,"utf8"));return p?.[0]?.results||p?.result?.[0]?.results||[]};const ledger=rows(process.argv[1]);const names=rows(process.argv[2]).map(r=>r.name).sort();const expected=["ghl_communication_source_records","idx_ghl_communication_source_contact","idx_ghl_communication_source_event","idx_ghl_communication_source_thread","idx_ghl_communication_source_type"].sort();if(ledger.length!==1)process.exit(1);if(ledger[0].name==="0034_communication_attachments.sql"&&names.length===0){fs.appendFileSync(process.env.GITHUB_OUTPUT,"action=apply\n");process.exit(0)}if(ledger[0].name==="0035_ghl_communication_source_archive.sql"&&JSON.stringify(names)===JSON.stringify(expected)){fs.appendFileSync(process.env.GITHUB_OUTPUT,"action=verify\n");process.exit(0)}process.exit(1)' "$before" "$table_state"
        env:
          CLOUDFLARE_ACCOUNT_ID: fa2b6f2441129b259dd5dea74045721b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_WRITE_LOGS: 'false'
      - name: Apply only migration 0035
        if: steps.boundary.outputs.action == 'apply'
        working-directory: crm-mirror-worker
        run: npx --yes wrangler@4.125.0 d1 migrations apply amari-crm-mirror --config wrangler.jsonc --remote
        env:
          CI: 'true'
          CLOUDFLARE_ACCOUNT_ID: fa2b6f2441129b259dd5dea74045721b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_WRITE_LOGS: 'false'
      - name: Verify exact installed schema
        working-directory: crm-mirror-worker
        shell: bash
        run: |
          set -euo pipefail
          ledger="$(mktemp)"
          schema="$(mktemp)"
          npx --yes wrangler@4.125.0 d1 execute amari-crm-mirror --config wrangler.jsonc --remote --command "SELECT id, name FROM d1_migrations ORDER BY id DESC LIMIT 1" --json > "$ledger"
          npx --yes wrangler@4.125.0 d1 execute amari-crm-mirror --config wrangler.jsonc --remote --command "SELECT type, name, tbl_name, sql FROM sqlite_schema WHERE name IN ('ghl_communication_source_records','idx_ghl_communication_source_event','idx_ghl_communication_source_thread','idx_ghl_communication_source_contact','idx_ghl_communication_source_type') ORDER BY name" --json > "$schema"
          node -e 'const fs=require("node:fs");const fail=(code)=>{console.error(code);process.exit(1)};const rows=(path)=>{const p=JSON.parse(fs.readFileSync(path,"utf8"));return p?.[0]?.results||p?.result?.[0]?.results||[]};const compact=(value)=>String(value||"").replace(/\s+/g," ").trim();const ledger=rows(process.argv[1]);const schema=rows(process.argv[2]);if(ledger.length!==1||ledger[0].name!=="0035_ghl_communication_source_archive.sql")fail("source_archive_ledger_verification_failed");const expected=["ghl_communication_source_records","idx_ghl_communication_source_contact","idx_ghl_communication_source_event","idx_ghl_communication_source_thread","idx_ghl_communication_source_type"].sort();if(JSON.stringify(schema.map(r=>r.name).sort())!==JSON.stringify(expected))fail("source_archive_catalog_names_failed");const table=schema.find(r=>r.name==="ghl_communication_source_records");if(schema.some(r=>r.tbl_name!=="ghl_communication_source_records")||table?.type!=="table"||schema.filter(r=>r.name!=="ghl_communication_source_records").some(r=>r.type!=="index"))fail("source_archive_catalog_types_failed");const tableSql=compact(table.sql);const tableShape=[/provider_event_id TEXT NOT NULL/i,/payload_json TEXT NOT NULL/i,/payload_sha256 TEXT NOT NULL CHECK \(length\(payload_sha256\) = 64\)/i,/PRIMARY KEY \(provider_event_id, payload_sha256\)/i];if(tableShape.some(pattern=>!pattern.test(tableSql)))fail("source_archive_table_shape_failed");if(/\bREFERENCES\b/i.test(tableSql))fail("source_archive_unexpected_foreign_key");const indexShape={idx_ghl_communication_source_event:/\(provider_event_id, last_seen_at DESC\)/i,idx_ghl_communication_source_thread:/\(provider_thread_id, occurred_at DESC\)/i,idx_ghl_communication_source_contact:/\(contact_external_id, occurred_at DESC\)/i,idx_ghl_communication_source_type:/\(message_type, occurred_at DESC\)/i};if(Object.entries(indexShape).some(([name,pattern])=>!pattern.test(compact(schema.find(r=>r.name===name)?.sql))))fail("source_archive_index_shape_failed")' "$ledger" "$schema"
        env:
          CLOUDFLARE_ACCOUNT_ID: fa2b6f2441129b259dd5dea74045721b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_WRITE_LOGS: 'false'
