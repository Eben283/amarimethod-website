name: tests

# Runs the complete unit and production-build contract on every PR and main
# push. The website is one deployment artifact: public source, Pages Functions,
# Workers, and each SPA can all make the release invalid.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            quiz-astro/package-lock.json
            portal/package-lock.json
            staff/package-lock.json
            cos/package-lock.json
      - run: npm ci
      - run: npm test
      # Advisory source scan: fails the job if a raw money/session field-ID literal
      # leaked outside functions/lib/ghl-fields.js. Belt-and-suspenders to the daily
      # local --beat run (which feeds /day) — CI going red on a stray literal is fine.
      - run: npm run check:field-ids
      - run: npm run check:owned-access
      - run: npm run check:build-contract
      - run: npm run build
