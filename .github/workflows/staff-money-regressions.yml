name: Staff money regressions
on:
  pull_request:
permissions:
  contents: read
jobs:
  balances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - run: node scripts/test-staff-money-ui.mjs
