name: Staff money regressions
on:
  pull_request:
permissions:
  contents: read
jobs:
  balances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/staff-money-runtime" --no-package-lock --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - run: STAFF_TEST_RUNTIME="$RUNNER_TEMP/staff-money-runtime" node scripts/test-staff-money-ui.mjs
