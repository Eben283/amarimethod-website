<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <title>Amari Partner | Your Toolkit</title>
  <meta name="description" content="Show the video, submit referrals, share your link.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Amari Partner">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#252525">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/partner-manifest.json">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <link rel="stylesheet" href="css/style-v5.css?v=15">
  <style>
    /* ===== Partner App Shell ===== */
    body {
      background: var(--bg-primary);
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app-shell {
      max-width: 420px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
      padding-top: max(2rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }

    .app-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .app-header img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      margin-bottom: 0.75rem;
    }
    .app-greeting {
      font-family: var(--font-serif-primary);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 0.25rem;
    }
    .app-subtext {
      font-size: 0.9rem;
      color: var(--color-text-secondary);
    }

    /* Action buttons */
    .app-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .app-action-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--color-border);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      cursor: pointer;
      text-decoration: none;
      color: var(--color-text);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .app-action-btn:active {
      transform: scale(0.98);
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }
    .app-action-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .app-action-icon svg {
      width: 24px;
      height: 24px;
    }
    .icon-video { background: rgba(235, 165, 132, 0.15); color: #EBA584; }
    .icon-refer { background: rgba(94, 140, 138, 0.12); color: #5E8C8A; }
    .icon-share { background: rgba(37, 37, 37, 0.08); color: #252525; }
    .app-action-label {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.3;
    }
    .app-action-desc {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      margin-top: 0.15rem;
      font-weight: 400;
    }

    /* Inline referral form */
    .inline-form {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .inline-form.active { display: block; }
    .inline-form h3 {
      font-family: var(--font-serif-primary);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .inline-form .field {
      margin-bottom: 1rem;
    }
    .inline-form label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: var(--color-text);
    }
    .inline-form input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--color-text);
      box-sizing: border-box;
    }
    .inline-form input:focus {
      outline: none;
      border-color: #5E8C8A;
      box-shadow: 0 0 0 2px rgba(94, 140, 138, 0.2);
    }
    .inline-form .form-error {
      color: #dc2626;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      display: none;
    }
    .inline-form .submit-btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background: #252525;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .inline-form .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Success state */
    .inline-success {
      display: none;
      text-align: center;
      padding: 1.5rem;
    }
    .inline-success.active { display: block; }
    .inline-success .check {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(94, 140, 138, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.75rem;
      font-size: 1.5rem;
      color: #5E8C8A;
    }
    .inline-success h3 {
      font-family: var(--font-serif-primary);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .inline-success p {
      font-size: 0.9rem;
      color: var(--color-text-secondary);
      margin-bottom: 1rem;
    }
    .inline-success button {
      background: none;
      border: 1px solid var(--color-border);
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--color-text);
    }

    /* Video modal */
    .video-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .video-modal.active { display: flex; }
    .video-modal-inner {
      width: 100%;
      max-width: 640px;
      position: relative;
    }
    .video-modal-close {
      position: absolute;
      top: -2.5rem;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
    }
    .video-placeholder-modal {
      width: 100%;
      padding-bottom: 56.25%;
      background: linear-gradient(135deg, #252525 0%, #3a3a3a 100%);
      border-radius: 12px;
      position: relative;
    }
    .video-placeholder-modal-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.7);
      gap: 0.75rem;
    }
    .video-placeholder-modal-inner span {
      font-size: 0.9rem;
    }

    /* Share link section */
    .app-share-section {
      background: var(--bg-card);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .app-share-section h3 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-secondary);
      margin-bottom: 0.75rem;
    }
    .share-link-row {
      display: flex;
      gap: 0.5rem;
    }
    .share-link-input {
      flex: 1;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 0.85rem;
      background: var(--bg-primary);
      color: var(--color-text);
      cursor: text;
    }
    .share-link-copy {
      padding: 0.65rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--bg-card);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .share-link-copy:active {
      background: var(--bg-secondary);
    }

    /* Footer text */
    .app-footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--color-text-meta);
      margin-top: 2rem;
    }
    .app-footer a {
      color: var(--color-text-secondary);
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="app-shell">

  <!-- Header -->
  <div class="app-header">
    <img src="/apple-touch-icon.png" alt="Amari Method">
    <div class="app-greeting" id="greeting">Hey there</div>
    <div class="app-subtext">Your Amari Method partner toolkit</div>
  </div>

  <!-- Main actions -->
  <div class="app-actions">

    <!-- 1. Show Client Video -->
    <button class="app-action-btn" id="btn-video" type="button">
      <div class="app-action-icon icon-video">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </div>
      <div>
        <div class="app-action-label">Show Client Video</div>
        <div class="app-action-desc">Play the 60-second explainer for your client</div>
      </div>
    </button>

    <!-- 2. I Sold a Session -->
    <button class="app-action-btn" id="btn-refer" type="button">
      <div class="app-action-icon icon-refer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <div>
        <div class="app-action-label">I Sold a Session</div>
        <div class="app-action-desc">Submit your client's name &amp; number</div>
      </div>
    </button>

    <!-- 3. Send Client the Quiz -->
    <button class="app-action-btn" id="btn-share" type="button">
      <div class="app-action-icon icon-share">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </div>
      <div>
        <div class="app-action-label">Share the Quiz Link</div>
        <div class="app-action-desc">Text your client their personalized link</div>
      </div>
    </button>

  </div>

  <!-- Inline referral form (hidden by default) -->
  <div class="inline-form" id="referral-form-panel">
    <h3>Client Info</h3>
    <form id="referral-form">
      <div class="field">
        <label for="client-name">Client First Name</label>
        <input type="text" id="client-name" name="clientFirstName" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="client-phone">Client Phone</label>
        <input type="tel" id="client-phone" name="clientPhone" inputmode="tel" autocomplete="tel" required>
      </div>
      <div class="form-error" id="form-error"></div>
      <button type="submit" class="submit-btn" id="submit-btn">Submit Referral</button>
    </form>
  </div>

  <!-- Referral success (hidden by default) -->
  <div class="inline-success" id="referral-success">
    <div class="check">&#10003;</div>
    <h3>Got It!</h3>
    <p id="success-message">We'll reach out and take it from here.</p>
    <button type="button" id="btn-another">Submit Another</button>
  </div>

  <!-- Share link panel (hidden by default, shown when "Share" clicked) -->
  <div class="app-share-section" id="share-panel" style="display: none;">
    <h3>Your Partner Link</h3>
    <p style="font-size: 0.85rem; color: var(--color-text-secondary); margin-bottom: 0.75rem;">
      Text this to clients — when they take the quiz, it tracks back to you.
    </p>
    <div class="share-link-row">
      <input type="text" class="share-link-input" id="share-link" readonly>
      <button type="button" class="share-link-copy" id="btn-copy">Copy</button>
    </div>
  </div>

  <!-- Video modal (fullscreen overlay) -->
  <div class="video-modal" id="video-modal">
    <div class="video-modal-inner">
      <button class="video-modal-close" id="btn-close-video">&times;</button>
      <div class="video-placeholder-modal">
        <div class="video-placeholder-modal-inner">
          <svg viewBox="0 0 24 24" style="width: 56px; height: 56px; fill: rgba(255,255,255,0.4);"><polygon points="8,5 19,12 8,19"/></svg>
          <span>Video coming soon</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="app-footer">
    <a href="https://www.amarimethod.com" target="_blank">amarimethod.com</a>
  </div>

</div>

<script>
(function () {
  // ── Read ?ref= parameter ──
  var params = new URLSearchParams(window.location.search);
  var ref = params.get('ref') || '';
  var refName = ref.replace(/<[^>]*>/g, '').replace(/[^a-zA-Z\s\-']/g, '').trim();
  if (refName) {
    refName = refName.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  // Personalize greeting
  if (refName) {
    document.getElementById('greeting').textContent = 'Hey, ' + refName;
  }

  // Build partner quiz link
  var partnerLink = 'https://www.amarimethod.com/client-landing' + (ref ? '?ref=' + encodeURIComponent(ref) : '');
  document.getElementById('share-link').value = partnerLink;

  // Persist ref in manifest start_url (for installed PWA)
  if (ref) {
    var manifestLink = document.querySelector('link[rel="manifest"]');
    // We can't dynamically change manifest start_url easily,
    // but the ref is already in the URL when they install
  }

  // ── Video button ──
  var videoModal = document.getElementById('video-modal');
  document.getElementById('btn-video').addEventListener('click', function () {
    videoModal.classList.add('active');
  });
  document.getElementById('btn-close-video').addEventListener('click', function () {
    videoModal.classList.remove('active');
  });
  videoModal.addEventListener('click', function (e) {
    if (e.target === videoModal) videoModal.classList.remove('active');
  });

  // ── Referral form toggle ──
  var formPanel = document.getElementById('referral-form-panel');
  var successPanel = document.getElementById('referral-success');

  document.getElementById('btn-refer').addEventListener('click', function () {
    // Toggle form visibility
    var isActive = formPanel.classList.contains('active');
    formPanel.classList.toggle('active');
    successPanel.classList.remove('active');
    if (!isActive) {
      document.getElementById('client-name').focus();
    }
  });

  // ── Referral form submit ──
  document.getElementById('referral-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var form = e.target;
    var submitBtn = document.getElementById('submit-btn');
    var errorDiv = document.getElementById('form-error');
    var originalText = submitBtn.textContent;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    errorDiv.style.display = 'none';

    var payload = {
      affiliateRef: ref || 'unknown',
      clientFirstName: form.clientFirstName.value.trim(),
      clientPhone: form.clientPhone.value.trim(),
    };

    try {
      var response = await fetch('/api/affiliate-refer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      var data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Something went wrong. Please try again.');
      }

      // Show success
      document.getElementById('success-message').textContent =
        "We'll reach out to " + payload.clientFirstName + ' and take it from here.';
      formPanel.classList.remove('active');
      successPanel.classList.add('active');

      // Reset form
      form.reset();
    } catch (err) {
      errorDiv.textContent = err.message;
      errorDiv.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });

  // Submit another
  document.getElementById('btn-another').addEventListener('click', function () {
    successPanel.classList.remove('active');
    formPanel.classList.add('active');
    document.getElementById('client-name').focus();
  });

  // ── Share link panel ──
  var sharePanel = document.getElementById('share-panel');
  document.getElementById('btn-share').addEventListener('click', function () {
    sharePanel.style.display = sharePanel.style.display === 'none' ? 'block' : 'none';

    // Try native share on mobile
    if (navigator.share) {
      navigator.share({
        title: 'Take the Pain Assessment',
        text: 'Find out what\'s causing your pain — free 2-minute quiz:',
        url: partnerLink,
      }).catch(function () {
        // User cancelled or not supported — just show the link
        sharePanel.style.display = 'block';
      });
    }
  });

  // Copy link
  document.getElementById('btn-copy').addEventListener('click', function () {
    var linkInput = document.getElementById('share-link');
    linkInput.select();
    navigator.clipboard.writeText(linkInput.value).then(function () {
      document.getElementById('btn-copy').textContent = 'Copied!';
      setTimeout(function () {
        document.getElementById('btn-copy').textContent = 'Copy';
      }, 2000);
    });
  });

  // ── Register service worker ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/partner-sw.js').catch(function () {
      // Silent fail — PWA features just won't work
    });
  }
})();
</script>
</body>
</html>
