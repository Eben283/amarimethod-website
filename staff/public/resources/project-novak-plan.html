<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Novak — Internal Plan</title>
    <style>
      :root { color: #163b40; background: #f7f4ee; font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { padding: 20px max(24px, calc((100vw - 900px) / 2)); background: #163b40; color: #fff; }
      header p { margin: 0; color: #e0bc73; font: 700 12px/1.2 ui-monospace, monospace; letter-spacing: .09em; text-transform: uppercase; }
      header h1 { max-width: 900px; margin: 8px auto 0; font-size: clamp(1.6rem, 4vw, 2.45rem); letter-spacing: -.045em; }
      main { width: min(900px, calc(100% - 40px)); margin: 42px auto 72px; color: #233c40; }
      .loading { color: #667579; }
      h1, h2, h3 { color: #163b40; letter-spacing: -.04em; }
      h1 { margin: 0 0 22px; font-size: clamp(2rem, 5vw, 3.5rem); line-height: .98; }
      h2 { margin: 52px 0 16px; padding-top: 12px; border-top: 2px solid #163b40; font-size: clamp(1.45rem, 3vw, 2rem); }
      h3 { margin: 32px 0 10px; font-size: 1.2rem; }
      p, li { max-width: 73ch; font-size: 17px; line-height: 1.65; }
      p { margin: 0 0 17px; }
      ul, ol { margin: 0 0 20px; padding-left: 26px; }
      li + li { margin-top: 7px; }
      strong { color: #163b40; }
      blockquote { margin: 24px 0; padding: 15px 20px; border-left: 4px solid #bb8c31; background: #efe4ca; font-size: 18px; line-height: 1.55; }
      table { width: 100%; margin: 24px 0; border-collapse: collapse; background: #fff; font-size: 15px; line-height: 1.45; }
      th, td { padding: 13px; border: 1px solid #b6c2c0; text-align: left; vertical-align: top; }
      th { background: #e8d9b9; color: #163b40; }
      a { color: #185f69; }
      @media (max-width: 600px) { main { width: min(100% - 28px, 900px); margin-top: 28px; } p, li { font-size: 16px; } table { display: block; overflow-x: auto; } }
    </style>
  </head>
  <body>
    <header><p>Amari Method · Internal</p><h1>Project Novak</h1></header>
    <main id="plan"><p class="loading">Loading the internal plan…</p></main>
    <script>
      const escapeHtml = (value) => value.replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]);
      const inline = (value) => escapeHtml(value)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
      const isTableDivider = (line) => /^\|?\s*:?-{3,}/.test(line);
      const cells = (line) => line.trim().replace(/^\||\|$/g, '').split('|').map((cell) => inline(cell.trim()));
      function render(markdown) {
        const lines = markdown.replace(/\r/g, '').split('\n');
        const output = []; let list = null;
        const closeList = () => { if (list) output.push(`</${list}>`); list = null; };
        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i];
          if (line.startsWith('|') && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
            closeList(); const headers = cells(line); i += 2; const rows = [];
            while (i < lines.length && lines[i].startsWith('|')) { rows.push(cells(lines[i])); i += 1; }
            i -= 1; output.push(`<table><thead><tr>${headers.map((cell) => `<th>${cell}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`); continue;
          }
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) { closeList(); const level = heading[1].length; output.push(`<h${level}>${inline(heading[2])}</h${level}>`); continue; }
          const item = line.match(/^(\d+\.|[-*])\s+(.+)$/);
          if (item) { const type = item[1] === '-' || item[1] === '*' ? 'ul' : 'ol'; if (list !== type) { closeList(); output.push(`<${type}>`); list = type; } output.push(`<li>${inline(item[2])}</li>`); continue; }
          closeList();
          if (!line.trim()) continue;
          if (line.startsWith('> ')) { output.push(`<blockquote>${inline(line.slice(2))}</blockquote>`); continue; }
          output.push(`<p>${inline(line)}</p>`);
        }
        closeList(); return output.join('');
      }
      fetch('project-novak-plan.txt').then((response) => response.ok ? response.text() : Promise.reject()).then((text) => { document.querySelector('#plan').innerHTML = render(text); }).catch(() => { document.querySelector('#plan').innerHTML = '<p>Unable to load the internal plan.</p>'; });
    </script>
  </body>
</html>
