<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <title>Submit a Referral | Amari Method Partner Portal</title>
  <meta name="description" content="Submit a client referral to the Amari Method. We'll reach out to your client and handle booking, sessions, and follow-up.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="author" content="Amari Method">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="canonical" href="https://www.amarimethod.com/refer">

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M3GJ6SZPY6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-M3GJ6SZPY6');
  </script>

  <link rel="stylesheet" href="css/style-v5.css?v=15">
</head>
<body>

<!-- include:nav -->
<!-- ===== MAIN CONTENT ===== -->
<main>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <div class="container hero-content">
      <h1 id="page-heading">Submit a Referral</h1>
      <p class="hero-subtitle">Name and number — we'll handle the rest.</p>
    </div>
  </section>

  <!-- ===== REFERRAL FORM ===== -->
  <section>
    <div class="container">
      <div class="referral-wrapper">

        <div id="referral-form-container">
          <form id="referral-form" class="referral-form">

            <div class="field">
              <label for="client-first-name">Client First Name *</label>
              <input type="text" id="client-first-name" name="clientFirstName" autocomplete="given-name" required>
            </div>

            <div class="field">
              <label for="client-phone">Client Phone *</label>
              <input type="tel" id="client-phone" name="clientPhone" inputmode="tel" autocomplete="tel" required>
            </div>

            <div id="form-error" class="form-error"></div>

            <button type="submit" id="submit-btn" class="btn-primary btn-block">
              <span class="btn-content"><span class="arrow">&rarr;</span><span class="btn-text">Submit Referral</span></span>
            </button>
          </form>
        </div>

        <div id="referral-success" class="referral-success">
          <div class="referral-success-icon">&#10003;</div>
          <h2>Got It!</h2>
          <p id="success-message">We'll reach out and take it from here.</p>
          <a href="refer" id="another-referral-link" class="btn-secondary"><span class="btn-content"><span class="arrow">&rarr;</span><span class="btn-text">Submit Another Referral</span></span></a>
        </div>

      </div>
    </div>
  </section>

</main>

<!-- include:footer -->
<script src="js/main.js?v=2" defer></script>
<script>
  // Read ?ref= parameter
  const urlParams = new URLSearchParams(window.location.search);
  const refParam = urlParams.get('ref') || '';

  // Personalize heading
  if (refParam) {
    document.getElementById('page-heading').textContent = 'Submit a Referral, ' + refParam;
    // Preserve ref param on "Submit Another" link
    document.getElementById('another-referral-link').href = 'refer?ref=' + encodeURIComponent(refParam);
  }

  document.getElementById('referral-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const form = e.target;
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('form-error');
    const btnText = submitBtn.querySelector('.btn-text');
    const originalText = btnText.textContent;

    // Disable button and show loading
    submitBtn.disabled = true;
    btnText.textContent = 'Submitting...';
    errorDiv.style.display = 'none';

    const payload = {
      affiliateRef: refParam || 'unknown',
      clientFirstName: form.clientFirstName.value.trim(),
      clientPhone: form.clientPhone.value.trim(),
    };

    try {
      const response = await fetch('/api/affiliate-refer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Something went wrong. Please try again.');
      }

      // Personalize success message
      document.getElementById('success-message').textContent =
        "We'll reach out to " + payload.clientFirstName + ' and take it from here.';

      // Show success
      document.getElementById('referral-form-container').style.display = 'none';
      document.getElementById('referral-success').style.display = 'block';

      // Track in GA4
      gtag('event', 'affiliate_referral_submitted', {
        affiliate_ref: payload.affiliateRef,
      });

    } catch (err) {
      errorDiv.textContent = err.message;
      errorDiv.style.display = 'block';
      submitBtn.disabled = false;
      btnText.textContent = originalText;
    }
  });
</script>
</body>
</html>
