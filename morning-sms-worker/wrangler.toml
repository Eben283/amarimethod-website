name = "morning-sms"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Morning window, every 5 minutes. Logic is PT-aware inside the worker; the UTC
# window covers ~4am–12pm PT across DST (11:00–19:59 UTC).
[triggers]
crons = ["*/5 11-19 * * *"]

# Same KV as Pages / other workers — send idempotency + GHL OAuth tokens.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

[vars]
# GHL contact ids: Eben Forrest + Garrett Hewstan (the contact that has a mobile).
MORNING_SMS_CONTACT_IDS = "3jsTC9Cb7hkDpC3FLuFd,lYgxJtvpRzWO2UvDh9ju"
# shadow = log would_send only; active = send via GHL conversations SMS.
MORNING_SMS_MODE = "active"
TIMEZONE = "America/Los_Angeles"
MORNING_SMS_PROVIDER = "ghl"

# Secrets (set once in this dir — pull from Bitwarden cloud-brain):
#   GHL_CLIENT_ID
#   GHL_CLIENT_SECRET
#   WORKER_AUTH_SECRET

[observability]
enabled = true
head_sampling_rate = 1
