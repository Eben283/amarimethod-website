name = "partner-activity-refresh"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Worker processes contacts in chunks of ~25 due to CF subrequest limit.
# With ~412 partner contacts that's ~17 chunks needed. Fire every 5 min in the
# 4-5 AM PDT window (~12 invocations) — completes most of the queue per night,
# stragglers picked up the next morning. Idle once queue is empty.
[triggers]
crons = ["*/5 6-7 * * *"]

# Same KV namespace as Pages + daily-audit + ghl-token-refresh
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# Secrets (set via `npx wrangler secret put <KEY>`):
#   GHL_CLIENT_ID     — same as ghl-token-refresh
#   GHL_CLIENT_SECRET — same as ghl-token-refresh
