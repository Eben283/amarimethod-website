<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Get notified when the Elbow Reset Study results are published, from Amari Method in San Francisco.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Elbow Reset Study: Get the Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site-v6.css?v=11">
<style>

  main.study-page{display:block}
  main.study-page .pagehead{background:var(--cream-2);padding:clamp(140px,16vw,180px) 0 clamp(40px,5vw,56px);text-align:center}
  main.study-page .pagehead .eyebrow{display:block;margin-bottom:18px;color:var(--body)}
  main.study-page .pagehead h1{font-size:clamp(2.2rem,4.6vw,3.4rem);font-weight:500;max-width:18ch;margin:0 auto;text-wrap:balance}
  main.study-page .pagehead p{margin:20px auto 0;max-width:48ch}
  main.study-page .body{padding:clamp(40px,5vw,72px) 0 clamp(72px,9vw,110px)}
  main.study-page .study-shell{max-width:560px;margin:0 auto}
  main.study-page details.learn{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 28px}
  main.study-page details.learn summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
  main.study-page details.learn summary::-webkit-details-marker{display:none}
  main.study-page details.learn summary::after{content:"+";font-size:18px;font-weight:400;line-height:1;color:var(--body)}
  main.study-page details.learn[open] summary::after{content:"–"}
  main.study-page .learn-body{padding:0 0 22px}
  main.study-page .learn-block{margin:0 0 18px}
  main.study-page .learn-block:last-child{margin:0}
  main.study-page .learn-label{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--body);margin:0 0 6px}
  main.study-page .learn-text{font-size:15px;line-height:1.65;color:var(--ink);margin:0;max-width:none}
  main.study-page .screen{border:1px solid var(--line);background:var(--paper);padding:18px 18px 14px;margin:8px 0 18px}
  main.study-page .screen-title{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--body);margin:0 0 14px}
  main.study-page .screen-item{display:flex;align-items:flex-start;gap:12px;font-size:15px;line-height:1.45;color:var(--ink);margin:0 0 12px;cursor:pointer}
  main.study-page .screen-item:last-child{margin-bottom:2px}
  main.study-page .screen-item.publish-optin{margin:0 0 18px;padding:0}
  main.study-page .screen-check{flex-shrink:0;width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
  main.study-page .field{margin-bottom:20px}
  main.study-page .field label{display:block;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--body);margin-bottom:9px}
  main.study-page .field .opt{font-weight:500;letter-spacing:.08em;text-transform:none;opacity:.75}
  main.study-page .field input[type="text"],
  main.study-page .field input[type="tel"],
  main.study-page .field input[type="email"]{width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:14px 16px;transition:border-color .3s var(--ease)}
  main.study-page .field input:focus{outline:none;border-color:var(--ink)}
  main.study-page .field-note{font-size:13px;color:var(--body);margin:8px 0 0;max-width:none}
  main.study-page .choice-group{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  main.study-page .choice-group input{position:absolute;opacity:0;pointer-events:none}
  main.study-page .choice-group label{display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:12px 4px;cursor:pointer;margin:0}
  main.study-page .choice-group input:checked + label{background:var(--ink);border-color:var(--ink);color:#fff}
  main.study-page .form-error{display:none;font-size:13px;color:#a13a2e;background:#fdf1ee;border:1px solid #f0c9c0;border-radius:2px;padding:12px 14px;margin-bottom:16px}
  main.study-page .form-error.show{display:block}
  main.study-page form .btn{width:100%;border:none;cursor:pointer;text-align:center}
  main.study-page form .btn:disabled{opacity:.6;cursor:default;transform:none}
  main.study-page .not-a-fit{margin:22px 0 0;font-size:14px;color:var(--body);text-align:center;max-width:none}
  main.study-page .not-a-fit a{border-bottom:1px solid var(--ink);padding-bottom:2px;color:var(--ink);font-weight:600}
  main.study-page .confirm{display:none;text-align:center;padding:12px 0 0}
  main.study-page .confirm.show{display:block}
  main.study-page .study-shell.confirmed .study-form,
  main.study-page .study-shell.confirmed details.learn,
  main.study-page .study-shell.confirmed .not-a-fit{display:none}
  main.study-page .confirm-mark{width:44px;height:44px;border-radius:2px;background:var(--peach);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 18px}
  main.study-page .confirm h2{font-size:clamp(1.6rem,3vw,2rem);font-weight:500;margin:0 0 12px}
  main.study-page .confirm p{margin:0 auto 8px;max-width:36ch}
  @media (max-width:640px){main.study-page .pagehead{padding-top:120px}}

</style>
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DGQM32BMYZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-DGQM32BMYZ');
</script>

</head>
<body>
<!-- Header is injected by site-v6.js -->

<main class="study-page">
<section class="pagehead"><div class="wrap">
  <span class="eyebrow">Amari Method &middot; Case Series</span>
  <h1>Get the Elbow Reset Study results</h1>
  <p>We&rsquo;re running a small study on tennis elbow with 30 SF players. Leave your email and we&rsquo;ll send you the findings when they&rsquo;re published.</p>
</div></section>

<section class="body"><div class="wrap">
  <div class="study-shell" id="card">
    <form class="study-form" id="emailForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" inputmode="email">
      </div>
      <p class="form-error" id="formError"></p>
      <button type="submit" class="btn" id="submitBtn">Notify me</button>
    </form>

    <div class="confirm" id="confirm">
      <div class="confirm-mark">&check;</div>
      <h2>You&rsquo;re on the list.</h2>
      <p>We&rsquo;ll email you when the results are published.</p>
    </div>
  </div>
</div></section>
</main>

<!-- Footer is injected by site-v6.js -->
<script src="/js/site-v6.js?v=14" data-nav=""></script>
<script>
  var form = document.getElementById('emailForm');
  var errorEl = document.getElementById('formError');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    fetch('/api/elbow-study-interest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value }),
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (!result.ok) {
          throw new Error(result.data && result.data.error ? result.data.error : 'Something went wrong. Please try again.');
        }
        document.getElementById('card').classList.add('confirmed');
        document.getElementById('confirm').classList.add('show');
        if (window.gtag) { gtag('event', 'elbow_study_interest'); }
      })
      .catch(function (err) {
        errorEl.textContent = err.message || 'Something went wrong. Please try again.';
        errorEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Notify me';
      });
  });
</script>
</body>
</html>
