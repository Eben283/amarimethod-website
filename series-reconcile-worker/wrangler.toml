name = "series-reconcile"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Hourly cron. Catches orphan paid orders within ~1 hour of completion.
# Each invocation processes typically 0-3 orders in the last 24h window, well
# under the 50-subrequest free-tier cap.
[triggers]
crons = ["15 * * * *"]

# Same KV namespaces as Pages + daily-audit + ghl-token-refresh
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# PURCHASE_KV holds idempotency records — same namespace the Pages-function
# backup webhook (functions/api/ghl-purchase-webhook.js) uses, but DIFFERENT
# key prefixes: worker writes processed:<orderId>, webhook writes
# order:<orderId>. Since 2026-07-02 the reconciler reads AND writes both
# prefixes so the two systems actually dedupe each other (the old comment
# claimed a shared key that never existed).
[[kv_namespaces]]
binding = "PURCHASE_KV"
id = "b8ef627521e04f5998a707d4a8f1935c"

# Secrets (set via `npx wrangler secret put <KEY>`):
#   GHL_CLIENT_ID     — same as ghl-token-refresh
#   GHL_CLIENT_SECRET — same as ghl-token-refresh

# amari-attendance D1 — the webhook's primary idempotency store (schema created
# 2026-07-02). The worker reads webhook claims and claims its own applies so a
# late webhook delivery can't double-credit.
[[d1_databases]]
binding = "ATTEND_DB"
database_name = "amari-attendance"
database_id = "8c66fe4c-bc3a-4a2d-905c-6f18f20f6faa"

# SHARED automation D1 — upgrade-offer timers swept hourly by this worker (GHL exit
# Unit C; schedule/cancel side lives in functions/lib/upgrade-offer.js). Same database as
# reminder-engine-worker + nurture-engine-worker. Until `wrangler d1 create amari-automation`
# runs and the id is pasted here (and in both engine wrangler.tomls), leave this block
# COMMENTED OUT — the sweep no-ops gracefully when the binding is absent.
# [[d1_databases]]
# binding = "AUTOMATION_DB"
# database_name = "amari-automation"
# database_id = "REPLACE_AFTER_wrangler_d1_create"

# Persist logs + metrics to the Workers dashboard so failures are searchable and
# countable (previously console.error/warn only existed during a live `wrangler
# tail` and vanished when the request/cron ended). head_sampling_rate=1 = keep all.
[observability]
enabled = true
head_sampling_rate = 1
