name = "series-reconcile"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Hourly cron. Catches orphan paid orders within ~1 hour of completion.
# Each invocation processes typically 0-3 orders in the last 24h window, well
# under the 50-subrequest free-tier cap.
[triggers]
crons = ["0 * * * *"]

# Same KV namespaces as Pages + daily-audit + ghl-token-refresh
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# PURCHASE_KV holds idempotency records — same namespace the Pages-function
# backup webhook (functions/api/ghl-purchase-webhook.js) uses, but DIFFERENT
# key prefixes: worker writes processed:<orderId>, webhook writes
# order:<orderId>. Since 2026-07-02 the reconciler reads AND writes both
# prefixes so the two systems actually dedupe each other (the old comment
# claimed a shared key that never existed).
[[kv_namespaces]]
binding = "PURCHASE_KV"
id = "b8ef627521e04f5998a707d4a8f1935c"

# Secrets (set via `npx wrangler secret put <KEY>`):
#   GHL_CLIENT_ID     — same as ghl-token-refresh
#   GHL_CLIENT_SECRET — same as ghl-token-refresh
