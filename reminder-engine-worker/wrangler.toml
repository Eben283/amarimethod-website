name = "reminder-engine"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Sweep every minute: fires (or shadow-logs) any step whose due_at has passed.
[triggers]
crons = ["* * * * *"]

# SHARED automation D1 spine (renamed from amari-reminder-engine before any deploy: the
# nurture engine lives in the same database so automation_events is one log — DASHBOARD-PLAN).
# Create ONCE (either worker dir), then apply BOTH workers' schema.sql:
#   npx wrangler d1 create amari-automation   # paste the returned id here AND in
#                                             # nurture-engine-worker/wrangler.toml
#   npx wrangler d1 execute amari-automation --remote --file=schema.sql   (run in each worker dir)
[[d1_databases]]
binding = "REMINDER_DB"
database_name = "amari-automation"
database_id = "089d810a-9d2d-43a4-8f1d-dc3620835557"

# Durable checkout-slot/booking-operation state. The one-minute recovery guard
# only reads recent public Assessment intents from this database and resumes the
# existing Pages fulfillment handler; it never owns a second booking path.
[[d1_databases]]
binding = "ATTEND_DB"
database_name = "amari-attendance"
database_id = "8c66fe4c-bc3a-4a2d-905c-6f18f20f6faa"

# Token cache for read-only GHL API lookups (webhook enrichment — the ghl-token-refresh
# worker keeps the token fresh; same namespace as Pages + the other workers).
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# The /webhook ingest forwards typed appointment events to the nurture engine.
# Cloudflare blocks worker→worker fetches via *.workers.dev on the same account, so the
# forward rides this SERVICE BINDING; NURTURE_ENGINE_URL below just gates/addresses it.
[[services]]
binding = "NURTURE"
service = "nurture-engine"

[vars]
NURTURE_ENGINE_URL = "https://nurture-engine.eben-fa2.workers.dev"

# Follow-Up reliability capture is deliberately absent from this ordinary deployment config.
# A separate evidence-capture release must provide all four exact bindings or the path fails closed:
# FOLLOW_UP_RELIABILITY_SPINE_ENABLED=enabled, FOLLOW_UP_RELIABILITY_SOURCE_VERSION,
# SOURCE_REVISION, and WORKER_VERSION. Adding the import alone performs no reliability read/write.
# No Show delivery is also fail-closed by default. A coordinated release must
# set both NO_SHOW_BEHAVIOR_RELEASE=approved and NO_SHOW_DELIVERY_RELEASE=approved,
# then publish v3 through the authenticated /workflow-release endpoint. Neither
# variable belongs in an ordinary deployment.

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (set once in this dir): WORKER_AUTH_SECRET (same value as the other workers + Pages env).
#   echo "<secret>" | npx wrangler secret put WORKER_AUTH_SECRET
# GHL_WEBHOOK_SECRET (same value as the Pages purchase webhooks — the /webhook ingest gate).
# Assessment test delivery only (all must be present; otherwise every flow remains shadow-only):
# ASSESSMENT_TEST_DELIVERY=enabled, ASSESSMENT_TEST_CONTACT_ID, ASSESSMENT_TEST_RECIPIENT,
# AMARI_MAIL_GOOGLE_OAUTH_CLIENT_ID, AMARI_MAIL_GOOGLE_OAUTH_CLIENT_SECRET.
# The recipient must be an Amari-controlled inbox. Do not set these for production client delivery.
