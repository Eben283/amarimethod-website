name = "reminder-engine"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Sweep every 5 minutes: fires (or shadow-logs) any step whose due_at has passed.
[triggers]
crons = ["*/5 * * * *"]

# SHARED automation D1 spine (renamed from amari-reminder-engine before any deploy: the
# nurture engine lives in the same database so automation_events is one log — DASHBOARD-PLAN).
# Create ONCE (either worker dir), then apply BOTH workers' schema.sql:
#   npx wrangler d1 create amari-automation   # paste the returned id here AND in
#                                             # nurture-engine-worker/wrangler.toml
#   npx wrangler d1 execute amari-automation --remote --file=schema.sql   (run in each worker dir)
[[d1_databases]]
binding = "REMINDER_DB"
database_name = "amari-automation"
database_id = "089d810a-9d2d-43a4-8f1d-dc3620835557"

# The /webhook ingest forwards typed appointment events to the nurture engine.
# Cloudflare blocks worker→worker fetches via *.workers.dev on the same account, so the
# forward rides this SERVICE BINDING; NURTURE_ENGINE_URL below just gates/addresses it.
[[services]]
binding = "NURTURE"
service = "nurture-engine"

[vars]
NURTURE_ENGINE_URL = "https://nurture-engine.eben-fa2.workers.dev"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (set once in this dir): WORKER_AUTH_SECRET (same value as the other workers + Pages env).
#   echo "<secret>" | npx wrangler secret put WORKER_AUTH_SECRET
# GHL_WEBHOOK_SECRET (same value as the Pages purchase webhooks — the /webhook ingest gate).
# Active mode only (later): GHL_CLIENT_ID, GHL_CLIENT_SECRET for the send adapter's token access.
