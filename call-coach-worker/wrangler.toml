name = "call-coach"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Readiness probe only (cheap OpenRouter ping + GHL token check). Full coaching
# is on-demand via /run or /coach-one — Whisper + LLM per contact is too expensive
# to auto-sweep daily while call coaching is idle.
# Staggered after daily-audit's 11:00 cron so we never race an on-demand GHL
# token refresh at the same second (2026-07-02 audit).
[triggers]
crons = ["15 10 * * *"]

# Self service binding — dispatches each coaching batch as a FRESH invocation
# (own CPU/memory/subrequest budget) instead of ctx.waitUntil-chaining them
# inside one invocation. Same pattern as daily-audit's /run-drift.
[[services]]
binding = "SELF"
service = "call-coach"

# Same KV namespace as Pages + daily-audit + ghl-token-refresh. The
# ghl-token-refresh worker keeps ghl_access_token / ghl_refresh_token /
# ghl_token_expiry fresh here; src/ghl.js reads them.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# Workers AI — used for @cf/openai/whisper transcription of GHL call
# recordings. Spike 0 (2026-06-13) confirmed recordings are reachable as
# audio/x-wav via GET /conversations/messages/{id}/locations/{loc}/recording,
# so the audio path is live (not the text-only fallback).
[ai]
binding = "AI"

# Secrets (set via `npx wrangler secret put <KEY>` — NOT committed):
#   GHL_CLIENT_ID       — same as ghl-token-refresh / daily-audit
#   GHL_CLIENT_SECRET   — same as ghl-token-refresh / daily-audit
#   OPENROUTER_API_KEY  — LLM coaching via OpenRouter
#   OPENROUTER_MODEL    — optional override (default google/gemini-2.5-flash-lite)
#   WORKER_AUTH_SECRET  — gates the /run, /latest, /ready HTTP routes (worker-auth.js)
#   CALL_COACH_CRON_ENABLED — set to "1" to re-enable daily full coaching sweeps

# Persist logs + metrics to the Workers dashboard so failures are searchable and
# countable (previously console.error/warn only existed during a live `wrangler
# tail` and vanished when the request/cron ended). head_sampling_rate=1 = keep all.
[observability]
enabled = true
head_sampling_rate = 1
