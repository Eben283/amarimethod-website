name = "parla-italiano"
main = "worker/index.js"
compatibility_date = "2025-07-01"
workers_dev = true

# Custom host on personal domain (DNS route added at first deploy if needed)
# Custom domain: add when token has zone Workers Routes permission
# [[routes]]
# pattern = "parla.ebenforrest.com/*"
# zone_name = "ebenforrest.com"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Secrets (set via wrangler secret put):
#   OPENROUTER_API_KEY
# Optional:
#   APP_ACCESS_CODE  — if set, clients must send it once to unlock the app

[vars]
OPENROUTER_MODEL = "openai/gpt-4o-mini"
APP_NAME = "Parla"

[observability]
enabled = true
head_sampling_rate = 1
