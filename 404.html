<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Page Not Found | Amari Method</title>
  <meta name="description" content="That Amari Method page could not be found. Return home, book an Assessment, or contact us.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/site-v6.css?v=404-1">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DGQM32BMYZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DGQM32BMYZ');
  </script>

  <style>
    .not-found {
      min-height: calc(100vh - 92px);
      padding: clamp(54px, 8vw, 116px) 40px;
      display: grid;
      place-items: center;
      background: var(--cream);
    }
    .not-found__sheet {
      width: min(100%, 1120px);
      display: grid;
      grid-template-columns: minmax(260px, .78fr) minmax(0, 1.22fr);
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .not-found__signal {
      min-height: 510px;
      padding: clamp(30px, 5vw, 64px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--mineral);
      color: var(--chalk);
    }
    .not-found__label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--chalk);
    }
    .not-found__code {
      font-size: clamp(7rem, 16vw, 12.5rem);
      font-weight: 500;
      line-height: .74;
      letter-spacing: -.09em;
      color: var(--chalk);
    }
    .not-found__path {
      display: grid;
      grid-template-columns: 1fr 10px;
      align-items: center;
      gap: 8px;
    }
    .not-found__path::before {
      content: "";
      height: 1px;
      background: rgba(244, 243, 238, .68);
    }
    .not-found__path::after {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--chalk);
    }
    .not-found__copy {
      padding: clamp(42px, 7vw, 84px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .not-found__copy .eyebrow { margin-bottom: 22px; }
    .not-found__copy h1 {
      max-width: 9ch;
      font-size: clamp(2.8rem, 6vw, 5.4rem);
      line-height: .96;
    }
    .not-found__copy > p {
      margin-top: 24px;
      font-size: clamp(1rem, 1.4vw, 1.14rem);
      line-height: 1.65;
    }
    .not-found__actions {
      margin-top: 34px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .not-found__links {
      margin-top: 44px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 12px 26px;
      font-size: 13px;
      color: var(--body);
    }
    .not-found__links a {
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
    }
    .not-found__links a:hover { color: var(--ink); }
    .not-found a:focus-visible {
      outline: 3px solid var(--mineral);
      outline-offset: 4px;
    }
    @media (max-width: 760px) {
      .not-found { padding: 28px 20px 48px; }
      .not-found__sheet { grid-template-columns: 1fr; }
      .not-found__signal {
        min-height: 230px;
        padding: 28px;
      }
      .not-found__code { font-size: clamp(6rem, 32vw, 10rem); }
      .not-found__copy { padding: 40px 28px 48px; }
      .not-found__actions .btn { width: 100%; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .not-found .btn { transition: none; }
    }
  </style>

  <script>
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "vuvx43xu8h");
  </script>
</head>
<body>
  <main class="not-found">
    <section class="not-found__sheet" aria-labelledby="not-found-title">
      <div class="not-found__signal" aria-hidden="true">
        <span class="not-found__label">Route ended</span>
        <strong class="not-found__code">404</strong>
        <span class="not-found__path"></span>
      </div>
      <div class="not-found__copy">
        <span class="eyebrow">Page not found</span>
        <h1 id="not-found-title">That path ends here.</h1>
        <p>The address may be old or mistyped. Start again from Amari, book an Assessment, or tell us what you were trying to find.</p>
        <div class="not-found__actions">
          <a href="/" class="btn">Return home</a>
          <a href="/assessment-booking" class="btn btn-outline">Book an Assessment</a>
        </div>
        <nav class="not-found__links" aria-label="Page recovery">
          <a href="/how-it-works">How Amari works</a>
          <a href="/portal/">Client portal</a>
          <a href="/contact">Contact us</a>
        </nav>
      </div>
    </section>
  </main>

  <script src="/js/site-v6.js" defer></script>
</body>
</html>
