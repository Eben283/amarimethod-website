<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e8e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9956d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d3d3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#555555;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Professional office setting suggestion -->
  <rect width="1600" height="300" fill="#f5f5f5" opacity="0.3"/>

  <!-- Figure circle for Dr. Garrett -->
  <circle cx="800" cy="450" r="180" fill="url(#skinTone)"/>

  <!-- Hair -->
  <ellipse cx="800" cy="320" rx="150" ry="120" fill="url(#hairGrad)"/>

  <!-- Professional shirt -->
  <rect x="650" y="500" width="300" height="250" fill="#1a3a3a" rx="20"/>

  <!-- Shirt detail -->
  <line x1="800" y1="500" x2="800" y2="750" stroke="#0d1f1f" stroke-width="2"/>

  <!-- Text -->
  <text x="800" y="820" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#2d6b59" text-anchor="middle">
    Dr. Garrett Hewstan
  </text>
  <text x="800" y="870" font-family="Georgia, serif" font-size="32" fill="#4a9b7f" text-anchor="middle" opacity="0.8">
    Body Alignment Expert
  </text>
</svg>
