<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4bf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a27d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8956b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hair1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3c2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d3127;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="200" fill="url(#bg1)"/>

  <!-- Head -->
  <circle cx="200" cy="130" r="50" fill="url(#skin1)"/>

  <!-- Hair -->
  <path d="M 150 110 Q 150 60 200 60 Q 250 60 250 110 Q 250 85 200 85 Q 150 85 150 110" fill="url(#hair1)"/>

  <!-- Smile/face suggestion -->
  <circle cx="190" cy="130" r="4" fill="#333" opacity="0.6"/>
  <circle cx="210" cy="130" r="4" fill="#333" opacity="0.6"/>

  <!-- Professional clothing -->
  <rect x="150" y="175" width="100" height="80" fill="#e8d9cc" rx="10"/>

  <!-- Clothing detail -->
  <path d="M 200 175 L 180 220 L 220 220" fill="#d4c4b0" opacity="0.5"/>

  <!-- Shoulders -->
  <ellipse cx="200" cy="255" rx="70" ry="30" fill="url(#bg1)" opacity="0.8"/>
</svg>
