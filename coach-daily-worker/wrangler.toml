name = "coach-daily"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Runs once daily at 7am PST (15:00 UTC) / 8am PDT.
# ±1h across DST is acceptable for a non-time-critical briefing job.
[triggers]
# :20, not :00 — conversation-cache STARTS its 3-hourly due-list rebuild at
# 15:00 exactly; reading at the same minute consumed the 12:00 snapshot (or a
# torn mid-rebuild one). 20 minutes lets the rebuild finish first.
crons = ["20 15 * * *"]

# Same KV namespace as all other workers.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "79cff30d0e45419791b0d25cd81961df"

# Secrets (set via `npx wrangler secret put <KEY>` — pull values from Keychain):
#   GHL_CLIENT_ID       am-ghl-client-id
#   GHL_CLIENT_SECRET   am-ghl-client-secret
#   WORKER_AUTH_SECRET  am-worker-auth-secret  (same secret as conversation-cache + call-coach)

# Persist logs + metrics to the Workers dashboard so failures are searchable and
# countable (previously console.error/warn only existed during a live `wrangler
# tail` and vanished when the request/cron ended). head_sampling_rate=1 = keep all.
[observability]
enabled = true
head_sampling_rate = 1
